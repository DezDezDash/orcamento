name: Atualizar Estoque DezDez

on:
  schedule:
    # 22:00 horário de Brasília (UTC-3, sem DST desde 2019) = 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:    # botão "Run workflow" na aba Actions

permissions:
  contents: write       # job precisa commitar estoque.json

jobs:

  atualizar:
    name: Coletar e publicar estoque.json
    runs-on: ubuntu-latest
    timeout-minutes: 30     # exporta o Excel de cada loja — roda em poucos minutos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Instala dependências e Chromium
        run: |
          pip install -r scraper/requirements.txt
          playwright install --with-deps chromium

      - name: Coleta estoque (exporta Excel de cada loja)
        env:
          WEBAPP_USERNAME: ${{ secrets.WEBAPP_USERNAME }}
          WEBAPP_PASSWORD: ${{ secrets.WEBAPP_PASSWORD }}
        run: |
          mkdir -p resultados
          python scraper/scraper.py --saida-dir resultados

      - name: Lista arquivos coletados
        run: |
          echo "Arquivos coletados:"
          ls -la resultados/ || true
          echo "Total de JSONs: $(find resultados -name '*.json' | wc -l)"

      - name: Consolida estoque.json
        run: |
          python scraper/consolidar.py \
            --inputs   resultados \
            --produtos scraper/produtos.xlsx \
            --saida    estoque.json

      - name: Commit no repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estoque.json
          if git diff --staged --quiet; then
            echo "Sem mudanças no estoque.json — nada a commitar."
            exit 0
          fi
          git commit -m "chore: atualiza estoque [$(TZ=America/Sao_Paulo date +'%Y-%m-%d %H:%M')]"
          # loop de pull-rebase pra tolerar push concorrente
          for i in 1 2 3 4 5; do
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)" || true
            if git push; then
              echo "✅ Push OK na tentativa $i"
              curl -s -X POST \
                -H "Authorization: Bearer ${{ secrets.DISPATCH_PAT }}" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/DezDezDash/Gestao-de-Estoque/dispatches \
                -d '{"event_type":"orcamento-atualizado"}'
              exit 0
            fi
            sleep $((RANDOM % 10 + 2))
          done
          echo "❌ Falhou após 5 tentativas"
          exit 1
